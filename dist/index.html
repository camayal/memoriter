<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Memoriter</title>
<link rel="preload" href="fonts/andika-700-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Andika Bold, stored in the project (assets/fonts/, SIL OFL 1.1), Latin subset: covers English and Spanish. */
@font-face{font-family:"Andika";font-style:normal;font-weight:700;font-display:swap;
  src:url("fonts/andika-700-latin.woff2") format("woff2")}
:root{
  --bg:#FFF7EA;
  --card:#FFFFFF;
  --back-bg:#7FB2F0;
  --page-bg:var(--bg);
  --mark:"";
  --tile:24px;
  --bgtile:56px;
  --ink:#2F3A4A;
  --gap:12px;
  --radius:18px;
  --flip:380ms;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--page-bg);overflow:hidden;
  font-family:"Andika","Nunito",system-ui,sans-serif;color:var(--ink);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  /* No pull-down-to-refresh, no rubber-band scrolling, no pinch or double-tap zoom. */
  overscroll-behavior:none;touch-action:none}
#setup{touch-action:pan-y}                         /* the parents' form can still scroll */
#board{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
#grid{display:grid;gap:var(--gap)}
.card{position:relative;perspective:900px;cursor:pointer;border:0;padding:0;background:none;
  width:var(--size);height:var(--size);outline:none}
.inner{position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform var(--flip) cubic-bezier(.4,0,.2,1)}
.card.up .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:var(--radius);backface-visibility:hidden;
  -webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 0 rgba(47,58,74,.12),0 6px 14px rgba(47,58,74,.08)}
.back{background:var(--back-bg)}
.back::after{content:var(--mark);width:34%;height:34%;border-radius:50%;
  background:rgba(255,255,255,.55);box-shadow:inset 0 -3px 0 rgba(0,0,0,.06)}
.front{background:var(--card);transform:rotateY(180deg);container-type:size;overflow:hidden}
.front svg{width:78%;height:78%}
.front img{width:84%;height:84%;object-fit:contain;pointer-events:none}
.txt{font-weight:700;line-height:1;white-space:nowrap;paint-order:stroke fill}
.card:focus-visible .face{box-shadow:0 0 0 4px #2F6FDB}
.card.gone{pointer-events:none}
.card.gone .inner{animation:pop .3s ease-in forwards}
@keyframes pop{
  0%{transform:rotateY(180deg) scale(1);opacity:1}
  35%{transform:rotateY(180deg) scale(1.08);opacity:1}
  100%{transform:rotateY(180deg) scale(.2);opacity:0}}
#night{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1.2s ease;
  background:radial-gradient(ellipse at 50% 35%,#2B3C7A 0%,#18224A 60%,#10173A 100%)}
#night.on{opacity:.94}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
/* Start screen: one tap unlocks sound + speech, so the very first card is heard. */
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(255,247,234,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  transition:opacity .4s ease;flex-direction:column}

#start.hide{opacity:0;pointer-events:none}
#langnote{max-width:min(90vw,520px);margin:1.4em 16px 0;text-align:center;
  font:600 14px/1.4 system-ui,sans-serif;color:#8a5a00}
#langnote:empty{display:none}
@media (prefers-reduced-motion:reduce){#start .tile,#end .tile{animation:none}}
.overlay{position:fixed;inset:16px;overflow:auto;background:#fff;border-radius:16px;padding:20px;
  font:14px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;box-shadow:0 10px 40px rgba(0,0,0,.15)}
@media (prefers-reduced-motion:reduce){:root{--flip:1ms}.card.gone .inner{animation:none;opacity:0}}
.overlay .voice{cursor:pointer;padding:2px 0}


/* Game tiles on the Start screen: a fanned stack of three mini cards per game. */
#start .themes{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--tile-gap,24px);
  width:var(--themes-w,auto);max-width:100%}
#start .tile,#end .tile{position:relative;width:var(--tile,200px);aspect-ratio:1;border:0;padding:0;cursor:pointer;
  border-radius:24%;background:var(--tint);box-shadow:0 .5vmin 0 rgba(47,58,74,.12),0 1.2vmin 2.4vmin rgba(47,58,74,.12);
  transition:translate .1s}                          /* no idle animation: calm, nothing moves until touched */
#start .tile:active,#end .tile:active{translate:0 .6vmin}
#start .mini,#end .mini{position:absolute;left:27%;top:24%;width:46%;aspect-ratio:1;border-radius:18%;background:#fff;
  display:flex;align-items:center;justify-content:center;container-type:size;
  box-shadow:0 2px 0 rgba(47,58,74,.1),0 3px 8px rgba(47,58,74,.12)}
#start .m2,#end .m2{transform:translate(-44%,-12%) rotate(-16deg) scale(.82)}
#start .m1,#end .m1{transform:translate(44%,-12%) rotate(14deg) scale(.82)}
#start .m0,#end .m0{transform:translateY(12%) scale(1.06)}
#start .m1>*,#start .m2>*,#end .m1>*,#end .m2>*{opacity:.75}
#start .mini svg,#end .mini svg{width:76%;height:76%}
#start .sym,#end .sym{font:700 72cqmin/1 "Andika","Nunito",system-ui,sans-serif}
#start .emo,#end .emo{font-size:64cqmin;line-height:1}
#start .mini svg.crayon,#end .mini svg.crayon{width:94%;height:94%}

/* After the fireworks: the game just played big in the middle, the other games small below. */
#end{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:calc(var(--tile-gap,24px) * 1.5);padding:16px;opacity:0;transition:opacity .6s}
#end.show{display:flex;animation:fadeIn .6s forwards}
#end .tile.big{width:var(--big,280px)}
#end .others{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--tile-gap,20px);max-width:var(--others-w,100%)}
#end .tile.small{width:var(--small,140px)}
@keyframes fadeIn{to{opacity:1}}

/* Replay badge on the tile of a parent-made game. */
.tile .replay{position:absolute;right:-4%;bottom:-4%;width:30%;aspect-ratio:1;border-radius:50%;
  background:#3DAA5C;color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 .4vmin 0 #2C7E44,0 .8vmin 1.6vmin rgba(47,58,74,.18)}
.tile .replay svg{width:58%;height:58%}
.mini img{width:84%;height:84%;object-fit:contain}

/* Parents' setup screen (?setup): plain grown-up form. */
#setup{position:fixed;inset:0;overflow:auto;background:var(--bg);z-index:10;
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
#setup .setup-wrap{max-width:640px;margin:0 auto;padding:24px 16px 48px}
#setup h1{font-size:24px;margin:0 0 4px}
#setup p.lead{margin:0 0 20px;color:#5b6573}
#setup fieldset{border:0;background:#fff;border-radius:14px;padding:14px 16px;margin:0 0 14px;
  box-shadow:0 1px 3px rgba(47,58,74,.1)}
#setup legend{font-weight:700;padding:0;margin-bottom:8px;float:left;width:100%}
#setup .row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;clear:both}
#setup label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
#setup .choices label{background:#F4F1EA;border-radius:10px;padding:8px 12px}
#setup .choices input:checked+span{font-weight:700}
#setup input[type=text],#setup input[type=number],#setup select,#setup textarea{
  font:inherit;padding:8px 10px;border:1px solid #cfd5dd;border-radius:8px;background:#fff;color:inherit}
#setup input[type=number]{width:90px}
#setup textarea{width:100%;min-height:96px;resize:vertical}
#setup small{color:#5b6573}
#setup .actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:18px}
#setup button{font:700 18px/1 system-ui,sans-serif;border:0;border-radius:12px;padding:14px 22px;cursor:pointer}
#setup .start{background:#3DAA5C;color:#fff;box-shadow:0 3px 0 #2C7E44}
#setup .copy{background:#E6ECF7;color:#23529F}
#setup .cancel{background:#E6ECF7;color:#23529F}
#setup .link{width:100%;font:13px/1.4 ui-monospace,Consolas,monospace;word-break:break-all;color:#5b6573}
#setup [hidden]{display:none!important}

/* Credit: very subtle, drawn by CSS (not real text, so it can't be selected or copied) and only on
   the start, end and setup screens; never while playing. */
#start::after,#end::after,#setup .setup-wrap::after{content:"By: C. A. Maya-Lastra - 2026";
  font:500 12px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.06em;
  pointer-events:none;user-select:none;-webkit-user-select:none;white-space:nowrap}
#start::after,#end::after{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));translate:-50% 0}
#start::after{color:rgba(47,58,74,.28)}
#end::after{color:rgba(255,255,255,.32)}
#setup .setup-wrap::after{display:block;text-align:center;margin-top:28px;color:rgba(47,58,74,.3)}
#start,#end{padding-bottom:26px}

/* Grown-up long press on a tile: it sinks slowly while held, then shows the replay badge (locked). */
.tile.holding{transition:scale 1s linear;scale:.93}
.tile.armed{scale:.97;outline:4px solid rgba(61,170,92,.55);outline-offset:4px}

/* Rest screen: a sleepy moon on a quiet night sky. Slow, soft motion only. */
#rest{position:fixed;inset:0;display:none;align-items:center;justify-content:center}
#rest.show{display:flex;animation:fadeIn 1.5s forwards;opacity:0}
#rest .sky{position:absolute;inset:0;width:100%;height:100%}
#rest .tw{animation:twinkle 4s ease-in-out infinite;opacity:.3}
#rest .t2{animation-delay:1.3s}#rest .t3{animation-delay:2.6s}
@keyframes twinkle{50%{opacity:.9}}
#rest .moon-hold{position:relative;width:min(60vmin,380px);aspect-ratio:1;cursor:default;pointer-events:none}
#rest .moon-hold svg{width:100%;height:100%;overflow:visible}
#rest .moon{animation:floaty 6s ease-in-out infinite;transform-origin:150px 150px}
@keyframes floaty{50%{transform:translateY(6px) rotate(-2deg)}}
#rest .z{opacity:0;animation:zz 4.5s ease-in-out infinite}
#rest .z2{animation-delay:1.5s}#rest .z3{animation-delay:3s}
@keyframes zz{0%{opacity:0;transform:translate(0,8px)}30%{opacity:.85}100%{opacity:0;transform:translate(10px,-14px)}}
/* Hidden grown-up unlock: one star like the others, near (not at) the top-right corner. The touch
   area is a bit bigger than the dot; holding it 4 s brightens the star, then unlocks. */
#rest .unlock-star{position:absolute;top:13%;right:13%;width:44px;height:44px;translate:50% -50%;
  display:flex;align-items:center;justify-content:center;touch-action:none;z-index:2}
#rest .unlock-star span{width:4px;height:4px;border-radius:50%;background:#fff;opacity:.35;
  animation:twinkle 4s ease-in-out infinite;animation-delay:.7s}
#rest .unlock-star.holding span{animation:none;opacity:1;scale:2.2;box-shadow:0 0 8px #fff;
  transition:opacity 4s linear,scale 4s linear,box-shadow 4s linear}
#rest::after{content:"By: C. A. Maya-Lastra - 2026";position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));translate:-50% 0;
  font:500 12px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.06em;color:rgba(255,255,255,.25);pointer-events:none;user-select:none}
@media (prefers-reduced-motion:reduce){#rest .moon,#rest .z,#rest .tw{animation:none}#rest .z{opacity:.7}}

/* EN · ES switch: tiny and faint, bottom-right of the start and end screens. */
.langsw{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:max(4px,env(safe-area-inset-bottom));
  display:flex;align-items:center;font:500 13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;color:rgba(47,58,74,.3)}
.langsw button{border:0;background:none;color:inherit;font:inherit;letter-spacing:.06em;padding:12px 6px;cursor:pointer}
.langsw button.on{color:rgba(47,58,74,.55);font-weight:700;cursor:default}
.langsw span{opacity:.7}
#end .langsw{color:rgba(255,255,255,.3)}
#end .langsw button.on{color:rgba(255,255,255,.6)}
.front svg.crayon{width:92%;height:92%}              /* colour cards: the diagonal crayon can use more of the card */


/* Setup: collapsible "Defaults (this device)" section below "Create a game". */
#setup h2{font-size:20px;margin:18px 0 4px}
#setup .create-form{margin-top:26px}
#setup .create-form details{background:#F6F3EC;border-radius:14px;padding:12px 14px}
#setup .create-form summary{font-weight:700;font-size:18px;cursor:pointer;padding:6px 2px}
#setup .create-form .lead{margin:8px 0 14px}
#setup .reset{background:#F1EEE8;color:#5b6573}
#setup .saved{color:#2C7E44;font-weight:600}

/* OpenMoji drawings sit in the text like an emoji glyph (their artwork has a margin, so a bit larger). */
img.emoji,.front img.emoji{width:1.2em;height:1.2em;object-fit:contain;vertical-align:middle;pointer-events:none}
#setup .credits{margin:14px 2px 0;font-size:13px;color:#5b6573}
#setup .credits a{color:inherit}

/* Grown-up door to setup: a faint "…" bottom-left (mirrors EN · ES); darkens over the 4 s hold. */
.setupdoor{position:absolute;left:max(10px,env(safe-area-inset-left));bottom:max(4px,env(safe-area-inset-bottom));
  padding:6px 12px 10px;font:700 18px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.1em;
  color:rgba(47,58,74,.3);cursor:default;touch-action:none;user-select:none;-webkit-user-select:none}
#end .setupdoor{color:rgba(255,255,255,.3)}
.setupdoor.holding{color:rgba(47,58,74,.8);transition:color 4s linear}
#end .setupdoor.holding{color:rgba(255,255,255,.85)}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFF7EA">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Memoriter">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
  if ("serviceWorker" in navigator && location.protocol.startsWith("http"))
    addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</head>
<body>
<div id="board"><div id="grid" role="grid" aria-label="Memory cards"></div></div>
<div id="start">
  <div class="themes"></div>
  <p id="langnote"></p>
</div>
<div id="night"></div>
<canvas id="fx"></canvas>
<div id="end"></div>
<div id="rest" aria-label="Time for a break">
  <svg class="sky" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g fill="#fff"><circle class="tw" cx="40" cy="50" r="2.2"/><circle class="tw t2" cx="90" cy="220" r="1.6"/><circle class="tw t3" cx="350" cy="60" r="2"/>
      <circle class="tw t2" cx="310" cy="240" r="1.8"/><circle class="tw" cx="200" cy="30" r="1.4"/><circle class="tw t3" cx="20" cy="160" r="1.5"/>
      <circle class="tw t3" cx="380" cy="170" r="1.6"/><circle class="tw t2" cx="150" cy="275" r="1.3"/></g>
  </svg>
  <div class="unlock-star" aria-hidden="true"><span></span></div>
  <div class="moon-hold">
    <svg viewBox="0 0 300 300" aria-hidden="true">
      <defs><mask id="crescent"><rect width="300" height="300" fill="#fff"/><circle cx="200" cy="105" r="90" fill="#000"/></mask></defs>
      <g class="moon">
        <circle cx="150" cy="150" r="100" fill="#FFE08A" mask="url(#crescent)"/>
        <path d="M82 150 q13 11 26 0" fill="none" stroke="#8A6A1F" stroke-width="5" stroke-linecap="round"/>
        <circle cx="96" cy="178" r="10" fill="#F6A5A5" opacity=".55"/>
        <path d="M112 202 q10 7 20 0" fill="none" stroke="#8A6A1F" stroke-width="4.5" stroke-linecap="round"/>
      </g>
      <g class="zzz" fill="#fff" font-family="Andika,Nunito,system-ui,sans-serif" font-weight="700">
        <text class="z z1" x="205" y="120" font-size="24">z</text>
        <text class="z z2" x="228" y="88" font-size="30">z</text>
        <text class="z z3" x="252" y="52" font-size="38">Z</text>
      </g>
    </svg>
  </div>
</div>

<script>
(() => {
"use strict";
/* ===== src/js/config.js ===== */
/* config.js: everything read from the URL, plus small shared helpers.
   Loaded first; every other file may use these names. */

/* Settings = the address (URLQ) on top of the defaults saved on this device in the setup screen
   (localStorage "memoriter-defaults"). Everything reads Q, so a saved default such as from=10 applies
   whenever the address doesn't say otherwise. Whether the game is fixed (THEME_GIVEN) is decided by
   the address only: saved defaults never lock the game, they only shape what each tile plays. */
const URLQ = new URLSearchParams(location.search);
const SAVED_DEFAULTS = (() => { try { return JSON.parse(localStorage.getItem("memoriter-defaults") || "{}") || {}; } catch { return {}; } })();
const Q = (() => {
  const q = new URLSearchParams();
  for (const [k, v] of Object.entries(SAVED_DEFAULTS)) if (v !== "" && v != null) q.set(k, String(v));
  for (const k of new Set(URLQ.keys())) { q.delete(k); for (const v of URLQ.getAll(k)) q.append(k, v); }
  return q;
})();
const num = (k, d) => { const v = parseFloat(Q.get(k)); return Number.isFinite(v) ? v : d; };
const list = k => Q.getAll(k).flatMap(v => v.split(",")).map(s => s.trim()).filter(Boolean);

/* Language: "es", "es-MX", "spanish", "español" … all work. LANG is the 2-letter code used for
   built-in words; LANG_TAG is the full tag used to pick a voice. */
const LANG_ALIASES = { spanish: "es", espanol: "es", "español": "es", english: "en", ingles: "en", "inglés": "en" };
/* Language: lang= in the address wins (parent-made links); otherwise the language last chosen with
   the EN · ES switch on this device; otherwise English. It can change while the game runs
   (switchLanguage in screens.js), so these are variables. */
const normLang = v => { v = String(v || "").trim().replace("_", "-"); return LANG_ALIASES[v.toLowerCase()] || v; };
const savedLang = (() => { try { return localStorage.getItem("memoriter-lang"); } catch { return null; } })();
let LANG_TAG = normLang(Q.get("lang") || savedLang || "en") || "en";
let LANG = LANG_TAG.slice(0, 2).toLowerCase() === "es" ? "es" : "en";

/* Theme: given with theme=…, or guessed from the other settings, so "?letters=vowels" alone
   already means the letters theme. */
const THEME_ALIASES = { number: "numbers", numeros: "numbers", "números": "numbers", letter: "letters", letras: "letters", shape: "shapes", formas: "shapes", figuras: "shapes", image: "images", imagenes: "images", "imágenes": "images", animals: "images", animales: "images", animal: "images", pictures: "images", dibujos: "images", color: "colors", colores: "colors" };
/* True when the URL already chooses the game, so the Start screen shows one "Let's go!" button
   instead of the theme tiles. */
const THEME_GIVEN = ["theme", "letters", "shapes", "items", "set"].some(k => URLQ.has(k));
function guessTheme() {
  const t = (URLQ.get("theme") || "").trim().toLowerCase();
  if (t) return THEME_ALIASES[t] || t;
  if (URLQ.has("letters")) return "letters";
  if (URLQ.has("shapes")) return "shapes";
  if (URLQ.has("items")) return "custom";
  if (URLQ.has("set")) return "images";
  return "numbers";
}

const CFG = {
  theme: guessTheme(),
  pairs: Math.max(1, Math.min(30, Math.floor(num("cards", 8) / 2))),   // cards=8 (default) → 4 pairs
  tts: Q.get("tts") !== "0",
  sound: Q.get("sound") !== "0",
  rate: num("rate", null),                            // null = use the voice preset's value
  pitch: num("pitch", null),
  colors: (Q.get("colors") || "one").toLowerCase(),   // one | pair | 0 | <name> | <hex>
  delay: num("delay", 1200),
  vanish: num("vanish", 900),
  // Pace: calm (default) ignores taps while two cards are open, until the wrong pair has turned back or
  // the found pair has popped away, so rushing does nothing. pace=fast lets a tap move on at once.
  fast: (Q.get("pace") || "").trim().toLowerCase() === "fast",
  // Peek: seconds every card is shown face up when a game starts (0 = off, the default; max 30).
  peek: Math.max(0, Math.min(30, num("peek", 0))),
  upper: (Q.get("case") || "upper").toLowerCase() !== "lower",
  // Letters: say the name ("bee"), the sound ("buh", phonics=1) or both ("B … buh", phonics=both).
  phonics: (Q.get("phonics") || "0").toLowerCase(),
  fullscreen: Q.get("fullscreen") !== "0",
  // Picture emoji: OpenMoji drawings (same on every device, default) or the device's own emoji.
  emoji: (Q.get("emoji") || "").toLowerCase() === "native" ? "native" : "openmoji",
  rest: Q.get("rest") === "0" ? 0 : Math.max(0, Math.round(num("rest", 6))),   // games before the rest screen (0 = never)
  calmMax: Q.get("grow") === "0" ? 0 : Math.max(0, Math.round(num("grow", 10))),   // extra calm rockets, max            // go full screen when a game tile is tapped
};

/* Random numbers: optionally seeded (seed=…) so the same shuffle repeats. */
let rnd = Math.random;
if (Q.has("seed")) {
  let a = num("seed", 1) >>> 0;
  rnd = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
const pick = (pool, n) => shuffle(pool.slice()).slice(0, n);
const randOf = a => a[Math.floor(Math.random() * a.length)];

let W = TEXT[LANG];                                 // current language's words (changes with the EN · ES switch)

/* Letter SOUNDS (phonics). Browsers can't be told "say the sound /b/", so each sound is spelled the
   way a voice will read it. Sounds you can hold (m, s, f …) are stretched ("mmm"); short ones get a
   tiny vowel ("buh"). Voices differ, so test them and adjust here if one sounds wrong.
   A single card can also be changed from the URL: items=B|buh shows B and says "buh". */
const PHONICS_EN = { a: "ah", b: "buh", c: "kuh", d: "duh", e: "eh", f: "fff", g: "guh", h: "huh", i: "ih", j: "juh", k: "kuh", l: "lll", m: "mmm", n: "nnn", o: "aw", p: "puh", q: "kwuh", r: "rrr", s: "sss", t: "tuh", u: "uh", v: "vvv", w: "wuh", x: "ks", y: "yuh", z: "zzz" };
const PHONICS_ES = { a: "a", b: "b", c: "k", d: "d", e: "e", f: "fff", g: "g", h: "", i: "i", j: "jjj", k: "k", l: "lll", m: "mmm", n: "nnn", "ñ": "ñ", o: "o", p: "p", q: "k", r: "rrr", s: "sss", t: "t", u: "u", v: "b", w: "u", x: "ks", y: "i", z: "sss" };
// Spanish voices read a lone consonant oddly, so stops get a short "u"/"e" like teachers say them.
Object.assign(PHONICS_ES, { b: "bu", c: "ku", d: "du", g: "gu", k: "ku", p: "pu", q: "ku", t: "tu", v: "bu", "ñ": "ñe", h: "(muda)" });

/* What a letter card says, following phonics=: 0 = name, 1 = sound, both = name then sound.
   (Spanish h is silent: in sound mode it says "muda", silent.) */
function letterSpeech(ch) {
  const name = W.letter(ch), sound = W.phonics(ch.toLowerCase()) ?? name;
  if (CFG.phonics === "1" || CFG.phonics === "sound") return sound === "(muda)" ? "muda" : sound;
  if (CFG.phonics === "both") return sound === "(muda)" ? `${name}, muda` : `${name}, ${sound}`;
  return name;
}

const LETTERS_ES = { a: "a", b: "be", c: "ce", d: "de", e: "e", f: "efe", g: "ge", h: "hache", i: "i", j: "jota", k: "ka", l: "ele", m: "eme", n: "ene", "ñ": "eñe", o: "o", p: "pe", q: "cu", r: "erre", s: "ese", t: "te", u: "u", v: "uve", w: "uve doble", x: "equis", y: "ye", z: "zeta" };

function numberES(n) {
  if (n < 0) return "menos " + numberES(-n);
  const U = ["cero", "uno", "dos", "tres", "cuatro", "cinco", "seis", "siete", "ocho", "nueve", "diez", "once", "doce", "trece", "catorce", "quince", "dieciséis", "diecisiete", "dieciocho", "diecinueve", "veinte", "veintiuno", "veintidós", "veintitrés", "veinticuatro", "veinticinco", "veintiséis", "veintisiete", "veintiocho", "veintinueve"];
  const T = { 3: "treinta", 4: "cuarenta", 5: "cincuenta", 6: "sesenta", 7: "setenta", 8: "ochenta", 9: "noventa" };
  const H = ["", "ciento", "doscientos", "trescientos", "cuatrocientos", "quinientos", "seiscientos", "setecientos", "ochocientos", "novecientos"];
  const below1000 = x => {
    if (x < 30) return U[x];
    if (x < 100) { const r = x % 10; return T[Math.floor(x / 10)] + (r ? " y " + U[r] : ""); }
    if (x === 100) return "cien";
    const r = x % 100; return H[Math.floor(x / 100)] + (r ? " " + below1000(r) : "");
  };
  if (n < 1000) return below1000(n);
  if (n < 1e6) { const k = Math.floor(n / 1000), r = n % 1000; return (k === 1 ? "mil" : below1000(k).replace(/uno$/, "un") + " mil") + (r ? " " + below1000(r) : ""); }
  return String(n);
}

function numberEN(n) {
  if (n < 0) return "minus " + numberEN(-n);
  const U = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen"];
  const T = ["", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"];
  const below1000 = x => {
    if (x < 20) return U[x];
    if (x < 100) { const r = x % 10; return T[Math.floor(x / 10)] + (r ? "-" + U[r] : ""); }
    const r = x % 100; return U[Math.floor(x / 100)] + " hundred" + (r ? " " + below1000(r) : "");
  };
  if (n < 1000) return below1000(n);
  if (n < 1e6) { const r = n % 1000; return below1000(Math.floor(n / 1000)) + " thousand" + (r ? " " + below1000(r) : ""); }
  return String(n);
}

/* What to speak for a card's text: whole numbers and single letters become words in the
   current language; anything else is spoken as written. */
function spoken(text) {
  const t = String(text).trim();
  if (/^-?\d+$/.test(t)) return W.number(parseInt(t, 10));
  if ([...t].length === 1 && /\p{L}/u.test(t)) return letterSpeech(t);
  return t;
}

/* ===== src/js/colors.js ===== */
/* colors.js: the toddler palette and colour helpers. */

/* Unambiguous, named colours, softened just enough. */
const NAMED = { red: "#E04848", blue: "#2F6FDB", yellow: "#F2C230", green: "#3DAA5C", orange: "#F28C28", purple: "#8A4FC7", pink: "#E8649E", brown: "#8B5A3C" };
const PALETTE = Object.values(NAMED);
const INK = "#2F3A4A";

const darker = (hex, f = .72) => "#" + [1, 3, 5].map(i => Math.round(parseInt(hex.substr(i, 2), 16) * f).toString(16).padStart(2, "0")).join("");
const lighten = (hex, f) => "#" + [1, 3, 5].map(i => { const v = parseInt(hex.substr(i, 2), 16); return Math.round(v + (255 - v) * f).toString(16).padStart(2, "0"); }).join("");

/* A colour from the URL: a palette name (optionally softened towards white) or a 6-digit hex. */
const colorParam = (k, dflt, soften = 0) => {
  const v = (Q.get(k) || "").toLowerCase();
  if (NAMED[v]) return soften ? lighten(NAMED[v], soften) : NAMED[v];
  if (/^#?[0-9a-f]{6}$/.test(v)) return "#" + v.replace("#", "");
  return dflt;
};

/* Colour for every card in a game. Default: one random colour shared by all cards, so the
   child matches the item itself and colour is never a clue or a distraction. Yellow is skipped
   in random picks because it is hard to read on a white card. */
function gameColors(n) {
  const c = CFG.colors;
  if (c === "pair") return Array.from({ length: n }, (_, i) => PALETTE[i % PALETTE.length]);
  let one;
  if (c === "0" || c === "ink") one = INK;
  else if (NAMED[c]) one = NAMED[c];
  else if (/^#?[0-9a-f]{6}$/.test(c)) one = "#" + c.replace("#", "");
  else one = randOf(PALETTE.filter(p => p !== NAMED.yellow));
  return Array(n).fill(one);
}

/* ===== src/js/patterns.js ===== */
/* patterns.js: card back and page background patterns.
   Pure CSS gradients for the geometric ones, tiny inline SVG tiles for the picture ones.
   Tile size comes from a CSS variable so the pattern scales with the cards. */

const svgTile = body => `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'>${body}</svg>`)}")`;
const heartPath = (x, y, s) => `<path transform='translate(${x} ${y}) scale(${s})' d='M0 7 C-7 2 -9 -1 -9 -4 C-9 -7 -6.5 -9 -4.5 -9 C-2.5 -9 -1 -8 0 -6 C1 -8 2.5 -9 4.5 -9 C6.5 -9 9 -7 9 -4 C9 -1 7 2 0 7Z'/>`;
const starPts = (cx, cy, R) => Array.from({ length: 10 }, (_, i) => { const r = i % 2 ? R * .45 : R, a = (-90 + i * 36) * Math.PI / 180; return `${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`; }).join(" ");

/* Each pattern returns a list of CSS background layers. f = pattern colour, t = tile size. */
const PATTERNS = {
  plain:    () => [],
  dots:     (f, t) => [`radial-gradient(circle, ${f} 13%, transparent 15%) 0 0/${t} ${t}`],
  polka:    (f, t) => [`radial-gradient(circle, ${f} 16%, transparent 18%) 0 0/${t} ${t}`,
                       `radial-gradient(circle, ${f} 16%, transparent 18%) calc(${t}/2) calc(${t}/2)/${t} ${t}`],
  stripes:  (f, t) => [`repeating-linear-gradient(90deg, ${f} 0 calc(${t}/4), transparent 0 calc(${t}/2))`],
  diagonal: (f, t) => [`repeating-linear-gradient(45deg, ${f} 0 calc(${t}/5), transparent 0 calc(${t}/2.5))`],
  checks:   (f, t) => [`conic-gradient(${f} 25%, transparent 0 50%, ${f} 0 75%, transparent 0) 0 0/${t} ${t}`],
  grid:     (f, t) => [`linear-gradient(${f} 2px, transparent 0) -1px -1px/${t} ${t}`, `linear-gradient(90deg, ${f} 2px, transparent 0) -1px -1px/${t} ${t}`],
  zigzag:   (f, t) => [`${svgTile(`<polyline points='0,25 10,15 20,25 30,15 40,25' fill='none' stroke='${f}' stroke-width='4' stroke-linejoin='round' stroke-linecap='round'/>`)} 0 0/${t} ${t}`],
  waves:    (f, t) => [`${svgTile(`<path d='M0 20 Q10 10 20 20 T40 20' fill='none' stroke='${f}' stroke-width='4' stroke-linecap='round'/>`)} 0 0/${t} ${t}`],
  stars:    (f, t) => [`${svgTile(`<g fill='${f}'><polygon points='${starPts(10, 11, 7)}'/><polygon points='${starPts(30, 31, 7)}'/></g>`)} 0 0/${t} ${t}`],
  hearts:   (f, t) => [`${svgTile(`<g fill='${f}'>${heartPath(10, 11, .75)}${heartPath(30, 31, .75)}</g>`)} 0 0/${t} ${t}`],
  bubbles:  (f, t) => [`${svgTile(`<g fill='none' stroke='${f}' stroke-width='2.5'><circle cx='10' cy='10' r='6'/><circle cx='29' cy='25' r='8'/><circle cx='12' cy='32' r='3'/></g>`)} 0 0/${t} ${t}`],
};

/* Random pick that never repeats the previous game's choice. */
const lastPick = {};
function freshPick(key, pool) {
  const options = pool.length > 1 ? pool.filter(v => v !== lastPick[key]) : pool;
  return (lastPick[key] = randOf(options));
}
const BACK_COLORS = Object.keys(NAMED).filter(k => k !== "brown");   // soft brown looks muddy

/* Called at the start of every game: card back pattern + colour (random by default) and page background. */
function applyPatterns() {
  const root = document.documentElement.style;
  const bc = (Q.get("backcolor") || "random").toLowerCase();
  const back = bc === "random" ? lighten(NAMED[freshPick("color", BACK_COLORS)], .35) : colorParam("backcolor", "#7FB2F0", .35);
  const bp = (Q.get("back") || "random").toLowerCase();
  const backPat = PATTERNS[bp === "random" ? freshPick("pattern", Object.keys(PATTERNS).filter(k => k !== "plain")) : bp] || PATTERNS.dots;
  root.setProperty("--back-bg", [...backPat("rgba(255,255,255,.38)", "var(--tile)"), `linear-gradient(160deg, ${back}, ${darker(back, .92)})`].join(","));
  if (Q.get("mark") === "0") root.setProperty("--mark", "none");
  // Page: plain by default; a very faint tone-on-tone pattern if asked.
  const bg = colorParam("bgcolor", "#FFF7EA", .82);
  const bgPat = PATTERNS[(Q.get("bg") || "plain").toLowerCase()] || PATTERNS.plain;
  root.setProperty("--page-bg", [...bgPat(darker(bg, .94), "var(--bgtile)"), bg].join(","));
}

/* shapes.js: SVG drawings for the shapes theme (viewBox 0 0 100 100).
   Each function takes a fill colour (c) and an outline colour (s). Names are translated in i18n.js. */

const poly = (n, r = 42, cy = 50, rot = -90) => Array.from({ length: n }, (_, i) => {
  const a = (rot + i * 360 / n) * Math.PI / 180; return `${(50 + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`; }).join(" ");
const starPoly = () => Array.from({ length: 10 }, (_, i) => {
  const r = i % 2 ? 19 : 44, a = (-90 + i * 36) * Math.PI / 180; return `${(50 + r * Math.cos(a)).toFixed(1)},${(53 + r * Math.sin(a)).toFixed(1)}`; }).join(" ");
const polygon = (pts, c, s) => `<polygon points="${pts}" fill="${c}" stroke="${s}" stroke-width="4" stroke-linejoin="round"/>`;

const SHAPES = {
  circle:    (c, s) => `<circle cx="50" cy="50" r="40" fill="${c}" stroke="${s}" stroke-width="4"/>`,
  oval:      (c, s) => `<ellipse cx="50" cy="50" rx="44" ry="28" fill="${c}" stroke="${s}" stroke-width="4"/>`,
  square:    (c, s) => `<rect x="15" y="15" width="70" height="70" rx="4" fill="${c}" stroke="${s}" stroke-width="4"/>`,
  rectangle: (c, s) => `<rect x="6" y="26" width="88" height="48" rx="4" fill="${c}" stroke="${s}" stroke-width="4"/>`,
  triangle:  (c, s) => polygon(poly(3, 46, 58), c, s),
  diamond:   (c, s) => polygon("50,6 84,50 50,94 16,50", c, s),
  pentagon:  (c, s) => polygon(poly(5, 44, 53), c, s),
  hexagon:   (c, s) => polygon(poly(6, 44, 50, 0), c, s),
  heptagon:  (c, s) => polygon(poly(7, 44, 52), c, s),
  octagon:   (c, s) => polygon(poly(8, 44, 50, -67.5), c, s),
  star:      (c, s) => polygon(starPoly(), c, s),
  // Semicircle: a half disk with a flat bottom.
  semicircle: (c, s) => `<path d="M8 70 A42 42 0 0 1 92 70 Z" fill="${c}" stroke="${s}" stroke-width="4" stroke-linejoin="round"/>`,
  // Arch (doorway with a tunnel cut out), turned off for now; to bring it back, uncomment it here
  // and add arch: "arch" / arch: "arco" to the shape names in i18n.js.
  // arch:      (c, s) => `<path d="M10 90 V48 A40 40 0 0 1 90 48 V90 H66 V64 A16 16 0 0 0 34 64 V90 Z" fill="${c}" stroke="${s}" stroke-width="4" stroke-linejoin="round"/>`,
  heart:     (c, s) => `<path d="M50 86 C20 64 8 48 8 32 C8 18 19 9 31 9 C40 9 46 14 50 21 C54 14 60 9 69 9 C81 9 92 18 92 32 C92 48 80 64 50 86Z" fill="${c}" stroke="${s}" stroke-width="4" stroke-linejoin="round"/>`,
};

/* ===== src/js/content.js ===== */
/* content.js: builds the list of card items for the chosen theme.
   Each item: { kind: "text" | "shape" | "swatch" | "img" | "emoji", show, say }
   "show" is what appears on the card, "say" is what the voice speaks (already in the game language). */

/* "shown|spoken" → item. Without "|", numbers and single letters are spoken as words (see spoken()). */
const parseItem = (raw, kind) => {
  const [show, say] = raw.split("|");
  return { kind, show: show.trim(), say: say !== undefined ? say.trim() : kind === "text" ? spoken(show) : show.trim() };
};

/* Picture set for the images theme: set=farm|wild|bugs|birds|sea|fruits|nature, or random (default).
   With random, a new set is chosen each time the child picks the pictures game (never the same
   twice in a row), and the voice names it: "Let's find pairs of fruits!". */
const SET_ALIASES = {
  animals: "farm", animales: "farm", granja: "farm", "farm animals": "farm",
  salvajes: "wild", safari: "wild", zoo: "wild", "wild animals": "wild",
  bichos: "bugs", insects: "bugs", insectos: "bugs", bug: "bugs",
  pajaros: "birds", "pájaros": "birds", aves: "birds", bird: "birds",
  mar: "sea", ocean: "sea", oceano: "sea", "océano": "sea", "sea animals": "sea",
  frutas: "fruits", fruta: "fruits", fruit: "fruits", naturaleza: "nature",
};
/* set= can name one set or several (set=farm,wild,sea); empty, "random" or "all" = every set. */
const SET_WANTED = [...new Set(list("set").map(v => SET_ALIASES[v.toLowerCase()] || v.toLowerCase()))].filter(k => W.sets[k]);
let chosenSet = null;
function chooseSet() {
  const pool = SET_WANTED.length ? SET_WANTED : Object.keys(W.sets);
  chosenSet = pool.length === 1 ? pool[0] : freshPick("set", pool);   // never the same set twice in a row
  return chosenSet;
}
const currentSet = () => chosenSet || chooseSet();

const THEMES = {
  numbers(n) {
    const from = Math.round(num("from", 1)), to = Math.round(num("to", from + n - 1));
    const lo = Math.min(from, to), hi = Math.max(from, to);
    const all = Array.from({ length: Math.min(hi - lo + 1, 1000) }, (_, i) => lo + i);
    return (all.length <= n ? all : pick(all, n)).map(v => ({ kind: "text", show: String(v), say: W.number(v) }));
  },

  letters(n) {
    const spec = (Q.get("letters") || "abc").toLowerCase();
    const abc = W.alphabet;
    let chars;
    if (["abc", "all", "a-z"].includes(spec)) chars = [...abc];
    else if (spec === "vowels" || spec === "vocales") chars = [..."aeiou"];
    else if (/^.-.$/u.test(spec)) { const a = abc.indexOf(spec[0]), b = abc.indexOf(spec[2]); chars = [...abc].slice(Math.min(a, b), Math.max(a, b) + 1); }
    else chars = [...new Set([...spec.replace(/[^\p{L}]/gu, "")])];
    return (chars.length <= n ? chars : pick(chars, n)).map(ch => ({ kind: "text", show: CFG.upper ? ch.toUpperCase() : ch, say: letterSpeech(ch) }));
  },

  shapes(n) {
    const want = list("shapes").map(s => s.toLowerCase()).filter(s => SHAPES[s]);
    return (want.length ? want.slice(0, n) : pick(Object.keys(SHAPES), n)).map(s => ({ kind: "shape", show: s, say: W.shapes[s] }));
  },

  /* Colour swatches, spoken as the colour's name. Every card keeps its own colour here. */
  colors(n) {
    return pick(Object.keys(W.colors), n).map(c => ({ kind: "swatch", show: c === "black" ? INK : NAMED[c], say: W.colors[c] }));
  },

  images(n) {
    // items= with emoji or image links (https://…, data:…, ./file.png); "shown|spoken" works here too.
    const custom = list("items").map(v => parseItem(v, /^(https?:|data:|\.{0,2}\/)/.test(v) ? "img" : "emoji"));
    if (custom.length) return pick(custom, n);
    return pick(W.sets[currentSet()].items.map(v => parseItem(v, "emoji")), n);
  },

  custom(n) {
    const items = list("items").map(v => parseItem(v, "text"));
    if (!items.length) return THEMES.numbers(n);
    return items.length <= n ? items : pick(items, n);
  },
};

function buildItems() {
  return (THEMES[CFG.theme] || THEMES.numbers)(CFG.pairs);
}

/* ===== src/js/audio.js ===== */
/* audio.js: all sound effects, synthesised with Web Audio (no sound files).
   Sounds stay soft on purpose: the audience is toddlers. */

let AC = null, master = null, noiseBuf = null;

/* Creates/resumes the audio engine. Browsers only allow this after a tap. */
function audio() {
  if (!CFG.sound) return null;
  if (!AC) {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
    AC = new C(); master = AC.createGain(); master.gain.value = 0.6; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 1.5, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (AC.state === "suspended") AC.resume();
  return AC;
}

function env(g, t, peak, attack, decay) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay); }

/* pan: -1 (left) … 1 (right), so a firework on the left is heard on the left. */
function out(pan) {
  if (!pan || !AC.createStereoPanner) return master;
  const p = AC.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan)); p.connect(master); return p;
}
function tone(freq, t, { type = "sine", peak = .15, attack = .005, decay = .12, to = null, pan = 0 } = {}) {
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(freq, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + attack + decay * .6);
  env(g, t, peak, attack, decay); o.connect(g).connect(out(pan)); o.start(t); o.stop(t + attack + decay + .05);
}
function noise(t, { dur = .4, peak = .2, filter = "lowpass", f0 = 1200, f1 = null, q = .7, attack = .005, pan = 0 } = {}) {
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; s.loop = true; f.type = filter; f.Q.value = q; f.frequency.setValueAtTime(f0, t);
  if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  env(g, t, peak, attack, dur); s.connect(f).connect(g).connect(out(pan));
  s.start(t, Math.random()); s.stop(t + attack + dur + .05);
}

const sfx = {
  /* Soft "bloop" when a card is touched (the flip itself is silent). */
  tap() { if (!audio()) return; tone(720, AC.currentTime, { type: "sine", peak: .18, decay: .09, to: 480 }); },
  /* Bubble pop when a matched card vanishes. */
  pop() {
    if (!audio()) return; const t = AC.currentTime;
    tone(260, t, { type: "sine", peak: .22, attack: .003, decay: .11, to: 1100 });
    noise(t, { dur: .03, peak: .05, filter: "highpass", f0: 2500 });
    tone(1568, t + .06, { type: "triangle", peak: .035, decay: .25 });
  },
  whoosh(pan) { if (!audio()) return; noise(AC.currentTime, { dur: .8, peak: .045, filter: "bandpass", f0: 300, f1: 2600, q: 1.4, attack: .3, pan }); },
  /* Toddler-safe bangs: a muffled thump plus a texture that matches the burst type. */
  burst(kind, pan, big = false) {
    if (!audio()) return; const t = AC.currentTime;
    noise(t, { dur: big ? .9 : .6, peak: big ? .2 : .14, f0: 700, f1: 120, pan });
    const penta = [1047, 1175, 1319, 1568, 1760, 2093, 2349, 2637];                          // C major pentatonic, high
    if (kind === "heart" || kind === "smile" || kind === "symbol" || kind === "rainbow") {                                              // happy arpeggio C-E-G-C
      [1047, 1319, 1568, 2093, 2637].forEach((f, i) => tone(f, t + .08 + i * .09, { type: "triangle", peak: .06, decay: .7, pan }));
    } else if (kind === "willow") {                                                           // long soft shimmer
      noise(t + .1, { dur: 2, peak: .035, filter: "highpass", f0: 5000, attack: .25, pan });
    } else if (kind === "glitter" || kind === "crossette") {                                  // gentle crackle
      for (let i = 0; i < 22; i++) noise(t + .35 + Math.random() * 1.1, { dur: .018, peak: .03 + Math.random() * .03, filter: "highpass", f0: 2500 + Math.random() * 3000, pan: pan + (Math.random() - .5) * .6 });
    } else {                                                                                  // twinkly notes
      for (let i = 0; i < 5; i++) tone(randOf(penta), t + .05 + i * .07 + Math.random() * .05, { type: "triangle", peak: .045, decay: .6, pan });
    }
  },
};

/* ===== src/js/speech.js ===== */
/* speech.js: text-to-speech with the browser's Web Speech API.
   The voices come from the browser + operating system, so what is available differs per device
   (Edge: natural Microsoft voices, Chrome: Google voices, IDE previews: older Windows voices).
   Presets pick the most natural voice of the wanted kind. Browsers don't expose a voice's
   gender, so it is guessed from well-known voice names. */

const synth = CFG.tts && "speechSynthesis" in window ? window.speechSynthesis : null;

const VOICE_PRESETS = {
  auto:   { gender: null,     rate: 1,   pitch: 1    },
  soft:   { gender: "female", rate: .92, pitch: 1.05 },
  female: { gender: "female", rate: 1,   pitch: 1    },
  male:   { gender: "male",   rate: 1,   pitch: .95  },
};
const FEMALE = /aria|jenny|ana\b|michelle|emma|ava|sonia|libby|maisie|natasha|clara|zira|hazel|susan|samantha|karen|moira|tessa|victoria|allison|serena|fiona|catherine|nicky|joanna|salli|kimberly|ivy|elvira|dalia|paloma|helena|laura|sabina|monica|mónica|paulina|marisol|esperanza|elena|lucia|lucía|camila|valentina|ximena|larissa|salome|salomé|paloma|sofia|sofía|catalina|maria|maría|belkys|ramona|andrea|teresa|marta|karla|yolanda|margarita|karina|tania|lorena|paola|female|mujer/i;
const MALE   = /guy|davis|tony|jason|brian|andrew|christopher|eric|roger|steffan|ryan|thomas|george|david|mark|james|daniel|alex\b|fred|tom\b|arthur|aaron|oliver|rishi|gordon|matthew|joey|justin|alvaro|álvaro|jorge|pablo|raul|raúl|gerardo|liberto|diego|tomas|tomás|juan|carlos|gonzalo|alonso|manuel|emilio|luis|andres|andrés|federico|roberto|mario|rodrigo|mateo|sebastian|sebastián|victor|víctor|lorenzo|marcelo|javier|male|hombre/i;
const VOICE_Q = (Q.get("voice") || "auto").toLowerCase();
const PRESET = VOICE_PRESETS[VOICE_Q] || VOICE_PRESETS.auto;

/* Higher = more natural sounding. */
const quality = v => {
  const n = v.name.toLowerCase(); let s = 0;
  if (/natural|neural/.test(n)) s += 50;                  // Edge "… Online (Natural)" voices
  if (/premium|enhanced|siri/.test(n)) s += 40;           // Apple downloadable voices
  if (/google/.test(n)) s += 30;                          // Chrome network voices
  if (/online/.test(n)) s += 10;
  if (/espeak|robot|compact/.test(n)) s -= 40;
  if (!v.localService) s += 5;
  return s;
};
const genderOf = v => MALE.test(v.name) && !/female|mujer/i.test(v.name) ? "male" : FEMALE.test(v.name) ? "female" : null;
const voiceLang = v => v.lang.toLowerCase().replace("_", "-");
const speaksLang = v => voiceLang(v).startsWith(LANG_TAG.toLowerCase()) || voiceLang(v).startsWith(LANG);

let voice = null, onlineFailed = false, noLangVoice = false;
/* Preferred accents when lang= gives no region: Spanish → Colombia first, then United States. */
const REGION_PREF = { es: ["es-co", "es-us"] };
const regionBonus = v => {
  if (LANG_TAG.includes("-")) return 0;                 // lang=es-MX etc. was asked for explicitly
  const i = (REGION_PREF[LANG] || []).indexOf(voiceLang(v));
  return i < 0 ? 0 : 40 - i * 10;
};

function chooseVoice() {
  if (!synth) return;
  const all = synth.getVoices();
  // Voices that speak the game language. After an online voice failed to start in time, prefer
  // voices installed on the device, but never switch to another language just for that.
  let pool = all.filter(speaksLang);
  if (onlineFailed && pool.some(v => v.localService)) pool = pool.filter(v => v.localService);
  noLangVoice = all.length > 0 && !pool.length;
  if (noLangVoice) pool = all.filter(v => v.default).concat(all);   // better a foreign accent than silence
  updateLangNotice();
  if (!VOICE_PRESETS[VOICE_Q]) {                                      // voice=<part of a name>
    const named = pool.find(v => v.name.toLowerCase().includes(VOICE_Q)) || all.find(v => v.name.toLowerCase().includes(VOICE_Q));
    if (named) { voice = named; return; }
  }
  const score = v => quality(v) + (PRESET.gender ? (genderOf(v) === PRESET.gender ? 100 : genderOf(v) ? -100 : 0) : 0)
                   + (voiceLang(v).startsWith(LANG_TAG.toLowerCase()) ? 20 : 0)    // exact region match (lang=es-MX)
                   + ((navigator.languages || []).some(l => l.toLowerCase() === voiceLang(v)) ? 10 : 0)    // the browser's own locale
                   + regionBonus(v);
  voice = pool.slice().sort((a, b) => score(b) - score(a))[0] || null;
}

/* Note for the grown-up on the Start screen when the device has no voice for the language. */
function updateLangNotice() {
  const el = document.getElementById("langnote"); if (!el) return;
  el.textContent = noLangVoice ? `${W.noVoice} Try Edge or Chrome, or add the language's speech pack in Windows Settings → Time & language → Speech. (?voices=1 lists the voices)` : "";
}

/* Speak right away: cut off anything still talking (a queue makes the voice lag behind the cards).
   If a voice doesn't start within 1.2 s, retry once (with an installed voice if it was an online one). */
let current = null;                                       // kept referenced: Chrome can drop utterances that get garbage-collected
/* opts: { pitch, rate } multipliers for this one utterance (e.g. a cheerful "Good job!"). */
function say(text, retry = true, opts = {}) {
  if (!synth || !text) return;
  const u = new SpeechSynthesisUtterance(text);
  // Always tag the utterance with the game language, so the engine pronounces it that way.
  u.lang = voice && speaksLang(voice) ? voice.lang : LANG_TAG;
  if (voice) u.voice = voice;
  u.rate = (CFG.rate ?? PRESET.rate) * (opts.rate || 1);
  u.pitch = Math.min(2, (CFG.pitch ?? PRESET.pitch) * (opts.pitch || 1));
  let started = false;
  u.onstart = () => { started = true; };
  current = u;
  // Chrome/Edge can silently drop an utterance spoken in the same instant as cancel(),
  // so only cancel when something is actually talking, and give it a moment.
  const busy = synth.speaking || synth.pending;
  if (busy) synth.cancel();
  synth.resume();                                         // un-sticks Chrome's occasionally paused queue
  setTimeout(() => { if (current === u) synth.speak(u); }, busy ? 60 : 0);
  if (retry) setTimeout(() => {
    if (started || current !== u) return;
    if (voice && !voice.localService) { onlineFailed = true; chooseVoice(); }
    synth.cancel(); say(text, false, opts);
  }, 1200);
}

function initSpeech() {
  if (!synth) return;
  chooseVoice();
  synth.addEventListener?.("voiceschanged", chooseVoice);
}

/* ===== src/js/fireworks.js ===== */
/* fireworks.js: canvas particles. Two uses:
   - sparkle(): small bursts (matched cards, Start button)
   - fireworksShow(): the short end show (about 4 seconds). The page dims to a soft night sky, then rockets with spark trails
     burst as peony, ring, double ring, willow, glitter, crossette (splits again), star, heart and
     smiley. Bursts glow (additive blending) and leave short trails; sounds pan with the burst. */

const fx = document.getElementById("fx"), ctx = fx.getContext("2d");
const night = document.getElementById("night");
const NIGHT_COLORS = PALETTE.map(c => lighten(c, .25)).concat(["#FFD86B", "#FFFFFF", "#7FE3FF"]);
const GOLD = "#FFCF6B";
const MAX_PARTS = 3500;
const BURSTS = ["peony", "ring", "double", "willow", "glitter", "crossette", "star", "peony", "ring"];

let parts = [], rockets = [], running = false, animating = false;
let timers = [];
let showDone = null;                                // called once the sky is empty after the show
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
const fxScale = () => Math.min(innerWidth, innerHeight) / 700;

function fitFx() { const r = devicePixelRatio || 1; fx.width = innerWidth * r; fx.height = innerHeight * r; ctx.setTransform(r, 0, 0, r, 0, 0); }
function kick() { if (!animating) { animating = true; requestAnimationFrame(frame); } }

function spark(o) {
  if (parts.length >= MAX_PARTS) return;
  parts.push({ px: o.x, py: o.y, life: 1, fade: .012, drag: .975, grav: .045, size: 2.4, glow: true, ...o });
}

/* Small burst at (x, y). color = null → mixed palette colours. */
function sparkle(x, y, size, color) {
  const n = 26, sp = size / 34;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + Math.random() * .2, v = sp * (.5 + Math.random() * .7);
    const col = color ? (Math.random() < .25 ? "#FFFFFF" : color) : randOf(PALETTE);
    spark({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, fade: .028, drag: .97, grav: .06, glow: false, color: col, size: 2.5 + Math.random() * 2.5 });
  }
  kick();
}

/* ----- Theme symbol for the big final burst -----
   One of the cards the child just matched is drawn off-screen (a letter, number or word as itself,
   a shape as itself, a colour as a crayon), and evenly spaced points along its OUTLINE become
   targets: every spark of the final rocket flies to one point and slows down there, so the
   symbol's outline shows up in sparks before it fades. Pictures (emoji) use their outline only when
   it is easy to recognise (checked one by one: cat, rabbit, fish, apple, car…); the others (round
   heads, boxes) get the happy-face firework instead. Shapes load as images, so this is prepared
   when the show starts; if it isn't ready, the heart or smiley is used. */
let finaleSymbol = null;
// Checked one by one (outline readable in sparks). Vehicles stay listed in case that set comes back.
const CLEAR_OUTLINES = new Set(["🐄", "🐖", "🐕", "🐈", "🐇", "🐎", "🐢", "🦨", "🐱", "🐰", "🐑", "🐐", "🦆", "🐓", "🐘", "🦒", "🦓", "🦋", "🕷️", "🐧", "🦢", "🐟",
  "🍎", "🍌", "🍐", "🍒", "🌙", "⭐", "☁️", "🌸", "🌳", "🚗", "✈️", "🚲", "🚁"]);
function prepareSymbol(item, color) {
  finaleSymbol = null;
  if (!item) return;
  if (item.kind === "img" || (item.kind === "emoji" && !CLEAR_OUTLINES.has(item.show))) { finaleSymbol = { smile: true }; return; }
  if (item.kind === "swatch") { finaleSymbol = { rainbow: true }; return; }   // colours: a rainbow arc reads better than a crayon
  const N = 160, cv = document.createElement("canvas"); cv.width = cv.height = N;
  const g = cv.getContext("2d");
  const done = () => { const points = outlinePoints(g, N); if (points) finaleSymbol = { points, color }; };
  g.fillStyle = "#000"; g.textAlign = "center"; g.textBaseline = "middle";
  if (item.kind === "emoji" && CFG.emoji === "openmoji") {
    const img = new Image();
    img.onload = () => { g.drawImage(img, 0, 0, N, N); done(); };
    img.onerror = () => { finaleSymbol = { smile: true }; };
    img.src = openmojiURL(item.show);
  } else if (item.kind === "text" || item.kind === "emoji") {
    let size = item.kind === "emoji" ? 128 : 140;
    const font = s => item.kind === "emoji" ? `${s}px sans-serif` : `700 ${s}px Andika, Nunito, system-ui, sans-serif`;
    g.font = font(size);
    const w = g.measureText(item.show).width;
    if (w > N * .94) { size *= N * .94 / w; g.font = font(size); }
    g.fillText(item.show, N / 2, N / 2 + size * .04);
    done();
  } else if (item.kind === "shape" || item.kind === "swatch") {
    let svg = item.kind === "shape" ? `<svg viewBox="0 0 100 100">${SHAPES[item.show]("#000", "#000")}</svg>` : crayonSVG(item.show);
    svg = svg.replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" ');
    const img = new Image();
    img.onload = () => { g.drawImage(img, 0, 0, N, N); done(); };
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  }
}
/* Edge pixels of the drawn symbol (filled pixel next to an empty one), thinned so neighbouring
   points are at least ~4 px apart, centred and scaled to -1…1. At most 260 points. */
function outlinePoints(g, N) {
  const d = g.getImageData(0, 0, N, N).data, on = (x, y) => x >= 0 && y >= 0 && x < N && y < N && d[(y * N + x) * 4 + 3] > 110;
  const edge = [];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++)
    if (on(x, y) && (!on(x - 2, y) || !on(x + 2, y) || !on(x, y - 2) || !on(x, y + 2))) edge.push([x, y]);
  if (edge.length < 12) return null;
  for (let i = edge.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [edge[i], edge[j]] = [edge[j], edge[i]]; }
  const cell = 4, taken = new Set(), pts = [];
  for (const [x, y] of edge) {
    const cx = Math.floor(x / cell), cy = Math.floor(y / cell);
    let near = false;
    for (let dx = -1; dx <= 1 && !near; dx++) for (let dy = -1; dy <= 1; dy++) if (taken.has((cx + dx) + "," + (cy + dy))) { near = true; break; }
    if (near) continue;
    taken.add(cx + "," + cy); pts.push([x, y]);
    if (pts.length >= 260) break;
  }
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const mx = (Math.min(...xs) + Math.max(...xs)) / 2, my = (Math.min(...ys) + Math.max(...ys)) / 2;
  const half = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)) / 2 || 1;
  return pts.map(([x, y]) => [(x - mx) / half, (y - my) / half]);
}

function launch(kind, x, ty) {
  const Wd = innerWidth, H = innerHeight;
  x = x ?? Wd * (.15 + Math.random() * .7);
  ty = ty ?? H * (.14 + Math.random() * .28);
  const vy = -Math.sqrt(H + 10 - ty) * .52;              // roughly tops out near the target height
  const r = { x, y: H + 10, vx: (Wd / 2 - x) * .0015 * Math.random(), vy, ty, kind: kind || randOf(BURSTS), color: randOf(NIGHT_COLORS), color2: randOf(NIGHT_COLORS) };
  rockets.push(r);
  sfx.whoosh(x / Wd * 2 - 1);
  return r;
}

function explode(r) {
  const S = fxScale() * (r.big ? 1.45 : 1), { x, y, color, color2 } = r, k = r.kind;
  const ring = (n, speed, col, extra = {}) => { const off = Math.random() * 7; for (let i = 0; i < n; i++) { const a = off + i / n * Math.PI * 2; spark({ x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, color: col, ...extra }); } };
  const shape = (n, fn, speed, col) => { for (let i = 0; i < n; i++) { const [dx, dy] = fn(i / n * Math.PI * 2); spark({ x, y, vx: dx * speed, vy: dy * speed, color: col, grav: .02, fade: .011 }); } };
  const sphere = (n, vMin, vMax, extra) => { for (let i = 0; i < n; i++) { const a = Math.random() * 7, v = S * (vMin + Math.random() * (vMax - vMin)); spark({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, ...extra() }); } };

  if (k === "peony") sphere(110, 1.5, 4.8, () => ({ color: Math.random() < .15 ? "#FFFFFF" : color }));
  else if (k === "ring") { ring(70, S * 4.2, color, { size: 2.8 }); ring(24, S * 1.6, "#FFFFFF", { size: 1.8, fade: .02 }); }
  else if (k === "double") { ring(64, S * 4.6, color, { size: 2.6 }); ring(44, S * 2.8, color2, { size: 2.6 }); }
  else if (k === "willow") sphere(120, 1, 4, () => ({ color: GOLD, fade: .0065, drag: .955, grav: .03, size: 2 }));
  else if (k === "glitter") sphere(100, 1.2, 4.6, () => ({ color: Math.random() < .5 ? "#FFFFFF" : color, twinkle: true, fade: .009 }));
  else if (k === "crossette") ring(18, S * 3.6, color, { size: 3.2, fade: .02, split: .55, splitColor: color2 });
  else if (k === "star") shape(120, a => { const q = 1 + .45 * Math.cos(5 * a); return [Math.cos(a - Math.PI / 2) * q, Math.sin(a - Math.PI / 2) * q]; }, S * 3, color);
  else if (k === "heart") {
    shape(130, t => [Math.sin(t) ** 3, -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 16], S * 4.4, lighten(NAMED.pink, .2));
    ring(30, S * 1.4, "#FFFFFF", { size: 1.8, fade: .02 });
  } else if (k === "rainbow") {
    // Rainbow arc: six bands of sparks (red outside → purple inside) that fly out and settle along
    // the top half of circles, like the symbol bursts (drag .92 → a spark travels 12.5 × its speed).
    const R = Math.min(innerWidth, innerHeight) * .27;
    const bands = ["#FF7A7A", "#FFB15C", "#FFE066", "#7EE08F", "#7FB2FF", "#C79BFF"];
    bands.forEach((col, i) => {
      const rad = R * (1 - i * .09), n = Math.round(46 - i * 3);
      for (let j = 0; j < n; j++) {
        const a = Math.PI + (j / (n - 1)) * Math.PI;            // left → over the top → right
        const tx = Math.cos(a) * rad, ty = Math.sin(a) * rad + R * .45;   // shifted down so the arc is centred
        spark({ x, y, vx: tx / 12.5, vy: ty / 12.5, drag: .92, grav: .003, fade: .0075, size: 3, color: Math.random() < .08 ? "#FFFFFF" : col });
      }
    });
  } else if (k === "symbol" && r.points) {
    // Sparks fly to the symbol's points: with drag .92 a spark travels v / (1 - .92) = 12.5 v in total.
    const R = Math.min(innerWidth, innerHeight) * .24;
    for (const [px, py] of r.points) spark({ x, y, vx: px * R / 12.5, vy: py * R / 12.5, drag: .92, grav: .003, fade: .0075, size: 3, color: Math.random() < .12 ? "#FFFFFF" : r.symbolColor });
    ring(36, S * 1.2, "#FFFFFF", { size: 1.6, fade: .025 });
  } else if (k === "smile") {
    const yellow = "#FFD86B", v = S * 4.4, o = { color: yellow, grav: .02, fade: .011 };
    ring(80, v, yellow, { grav: .02, fade: .011 });
    for (const ex of [-.38, .38]) for (let i = 0; i < 10; i++) { const a = i / 10 * 7; spark({ x, y, vx: (ex + Math.cos(a) * .07) * v, vy: (-.32 + Math.sin(a) * .07) * v, ...o }); }
    for (let i = 0; i < 26; i++) { const a = Math.PI * (.2 + .6 * i / 25); spark({ x, y, vx: Math.cos(a) * .6 * v, vy: Math.sin(a) * .6 * v, ...o }); }
  }
  // Flash of light at the burst centre.
  parts.push({ x, y, px: x, py: y, vx: 0, vy: 0, life: 1, fade: .09, drag: 1, grav: 0, size: 26 * S, flash: true, glow: true, color: "#FFFFFF" });
  sfx.burst(k, x / innerWidth * 2 - 1, r.big);
}

function frame() {
  // Fade what is already drawn instead of clearing: this leaves soft trails.
  ctx.globalCompositeOperation = "destination-out";
  ctx.fillStyle = "rgba(0,0,0,.24)"; ctx.fillRect(0, 0, innerWidth, innerHeight);
  ctx.lineCap = "round";

  rockets = rockets.filter(r => {
    const px = r.x, py = r.y;
    r.x += r.vx; r.y += r.vy; r.vy *= .985; r.vy += .02;
    ctx.globalCompositeOperation = "lighter";
    ctx.strokeStyle = GOLD; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(r.x, r.y); ctx.stroke();
    if (Math.random() < .7) spark({ x: r.x, y: r.y, vx: (Math.random() - .5) * .8, vy: Math.random() * 1.2, color: GOLD, fade: .05, size: 1.6 });
    if (r.y <= r.ty || r.vy >= -.5) { explode(r); return false; }
    return true;
  });

  const born = [];
  parts = parts.filter(p => {
    p.px = p.x; p.py = p.y;
    p.vx *= p.drag; p.vy = p.vy * p.drag + p.grav; p.x += p.vx; p.y += p.vy; p.life -= p.fade;
    if (p.split && p.life < p.split) {                     // crossette: break into a little cross
      for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2 + Math.PI / 4, v = fxScale() * 2.2; born.push({ x: p.x, y: p.y, px: p.x, py: p.y, vx: Math.cos(a) * v + p.vx, vy: Math.sin(a) * v + p.vy, life: .8, fade: .02, drag: .96, grav: .04, size: 2, glow: true, twinkle: true, color: p.splitColor }); }
      return false;
    }
    let a = Math.max(0, p.life);
    if (p.twinkle && Math.random() < .35) a *= .2;
    ctx.globalCompositeOperation = p.glow && running ? "lighter" : "source-over";
    ctx.globalAlpha = a;
    if (p.flash) {
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
      g.addColorStop(0, "rgba(255,255,255,.55)"); g.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = g; ctx.fillRect(p.x - p.size, p.y - p.size, p.size * 2, p.size * 2);
    } else {
      ctx.strokeStyle = p.color; ctx.lineWidth = p.size * (.5 + a * .5);
      ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x, p.y); ctx.stroke();
    }
    return p.life > 0 && p.y < innerHeight + 40;
  });
  parts.push(...born);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";

  if (running || rockets.length || parts.length) requestAnimationFrame(frame);
  else {
    animating = false; ctx.clearRect(0, 0, innerWidth, innerHeight);
    // Show over and every spark gone: only now the tiles (or the moon) may appear, after a short calm pause.
    if (showDone) { const f = showDone; showDone = null; later(f, 500); }
  }
}

/* Fireworks end show. onReady fires when the "play again" button may appear (to practise patience). */
function fireworksShow(onReady, round = 1) {
  running = true; night.classList.add("on");
  // Cheerful end phrase: a different one each round (win= fixes it), spoken a little higher and a
  // touch slower so it sounds happy and sing-song.
  say(Q.get("win") || freshPick("win-" + LANG, W.wins || [W.win]), true, { pitch: 1.25, rate: .92 });
  const Wd = innerWidth, H = innerHeight, reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let t = 400;
  // 1. Two single rockets.
  for (let i = 0; i < 2; i++) { later(() => launch(), t); t += 550; }
  // 2. One mirrored pair, left and right.
  if (!reduced) {
    const k = randOf(BURSTS), x = Wd * (.2 + Math.random() * .1), y = H * (.2 + Math.random() * .15);
    later(() => { launch(k, x, y); launch(k, Wd - x, y); }, t); t += 700;
  }
  // 3. A quick volley.
  if (!reduced) for (let i = 0; i < 4; i++) { later(() => launch(), t); t += 180; }
  // 3b. Calm part that grows with each finished game: one slow rocket more per game, up to
  //     CFG.calmMax (default 10, about 9 s more). grow=0 turns it off.
  const extra = Math.min(Math.max(0, round - 1), CFG.calmMax);
  for (let i = 0; i < extra; i++) { t += 900; later(() => launch(randOf(["peony", "ring", "willow"])), t); }
  // 4. Big heart or smiley in the middle.
  t += 300;
  // The big final burst: a symbol from the game just played (see prepareSymbol), else heart/smiley.
  later(() => {
    const sym = finaleSymbol;
    const kind = sym && sym.points ? "symbol" : sym && sym.rainbow ? "rainbow" : sym && sym.smile ? "smile" : (Math.random() < .5 ? "heart" : "smile");
    const r = launch(kind, Wd / 2, H * .32);
    r.big = true;
    if (kind === "symbol") { r.points = sym.points; r.symbolColor = sym.color; }
  }, t);
  later(() => { running = false; }, t + 1800);
  // The tiles wait until the last firework (the theme symbol) has completely faded; again=ms forces a fixed time.
  if (Q.has("again")) later(onReady, num("again", 0)); else showDone = onReady;
  kick();
}

function stopFireworks() {
  showDone = null;
  timers.forEach(clearTimeout); timers = []; rockets = []; running = false;
  night.classList.remove("on");
}

function initFireworks() {
  fitFx();
  addEventListener("resize", fitFx);
}

/* ===== src/js/board.js ===== */
/* board.js: the game itself: dealing cards, flipping, matching, layout. */

const grid = document.getElementById("grid"), board = document.getElementById("board");
let cards = [], openCards = [], locked = false, matched = 0, total = 0, peeking = false, peekTimer = null;
let mismatch = null;                                // { a, b, timer } while two different cards are showing

/* Emoji as HTML. Default: the OpenMoji drawing (https://openmoji.org, CC BY-SA 4.0), identical on
   every device, from assets/openmoji/ (dist/openmoji/ once built). emoji=native uses the device's
   own emoji. If a drawing is missing, the device emoji is shown instead. */
const OPENMOJI_DIR = "openmoji/";
const openmojiCode = e => [...e].filter(c => c !== "\uFE0F").map(c => c.codePointAt(0).toString(16).toUpperCase()).join("-");
const openmojiURL = e => OPENMOJI_DIR + openmojiCode(e) + ".svg";
function emojiHTML(e) {
  if (CFG.emoji === "native") return escapeHTML(e);
  return `<img class="emoji" src="${openmojiURL(e)}" alt="${escapeHTML(e)}" draggable="false" onerror="this.replaceWith(this.alt)">`;
}

function faceHTML(item, color) {
  if (item.kind === "shape") return `<svg viewBox="0 0 100 100" aria-hidden="true">${SHAPES[item.show](color, darker(color, .85))}</svg>`;
  if (item.kind === "swatch") return crayonSVG(item.show);      // colours: a crayon in that colour (same drawing as the tile)
  if (item.kind === "img") return `<img src="${encodeURI(item.show)}" alt="" draggable="false">`;
  const len = [...item.show].length;
  const size = item.kind === "emoji" ? 66 : Math.min(64, 150 / len);
  const inner = item.kind === "emoji" ? emojiHTML(item.show) : escapeHTML(item.show);
  return `<span class="txt" style="font-size:${size}cqmin;color:${color}">${inner}</span>`;
}

function newGame() {
  applyPatterns();                                  // new random card back each game
  const items = buildItems();
  if (mismatch) clearTimeout(mismatch.timer);
  clearTimeout(peekTimer); peeking = false;
  total = items.length; matched = 0; openCards = []; locked = false; mismatch = null;
  const colors = gameColors(items.length);
  const deck = shuffle(items.flatMap((it, i) => [{ ...it, id: i, color: colors[i] }, { ...it, id: i, color: colors[i] }]));
  grid.innerHTML = "";
  cards = deck.map((d, idx) => {
    const el = document.createElement("button");
    el.className = "card"; el.setAttribute("aria-label", "card " + (idx + 1));
    el.dataset.say = d.say;                         // what this card speaks (used by tests/check.py)
    el.innerHTML = `<div class="inner"><div class="face back"></div><div class="face front">${faceHTML(d, d.color)}</div></div>`;
    /* React the instant a finger touches the card. A "click" only fires if the finger lifts without
       sliding or holding, which small fingers often don't manage, so some taps were lost. */
    el.addEventListener("pointerdown", e => { if (e.button > 0) return; e.preventDefault(); onTap(idx); });
    el.addEventListener("click", e => { if (e.detail === 0) onTap(idx); });   // keyboard (Enter/Space)
    el.addEventListener("contextmenu", e => e.preventDefault());             // long press: no menu
    grid.appendChild(el);
    return { ...d, el, up: false, done: false };
  });
  layout();
}

function onTap(i) {
  const c = cards[i];
  audio();                                          // make sure audio is unlocked
  if (peeking || c.done || c.up) return;
  // Two cards still open. Calm pace (default): the tap is ignored completely (no sound, no movement),
  // so tapping fast gets nothing and the child learns to watch the cards. pace=fast: a tap turns the
  // wrong pair back right away and goes on.
  if (locked) { if (!CFG.fast) return; flipBack(); }
  sfx.tap();
  c.up = true; c.el.classList.add("up"); c.el.setAttribute("aria-label", c.say);
  // The second card of a pair found right away isn't spoken again: the word was just said.
  const sameAsOpen = openCards.length === 1 && openCards[0].id === c.id;
  if (!sameAsOpen) say(c.say);
  openCards.push(c);
  if (openCards.length < 2) return;
  const [a, b] = openCards; openCards = [];
  if (a.id === b.id) {
    a.done = b.done = true;
    const last = ++matched === total;
    // Let the child see and hear the pair, then pop them away one after the other.
    setTimeout(() => vanish(a), CFG.vanish);
    setTimeout(() => vanish(b), CFG.vanish + 160);
    // Calm pace: wait until both cards have popped away (pop animation .3 s) before taking taps again.
    if (!CFG.fast) { locked = true; setTimeout(() => { if (!mismatch) locked = false; }, CFG.vanish + 160 + 300); }
    if (last) setTimeout(finale, CFG.vanish + 900);
  } else {
    locked = true;
    mismatch = { a, b, timer: setTimeout(flipBack, CFG.delay) };
  }
}

/* Peek (peek=N, off by default): when the game starts, every card is shown face up for N seconds,
   silently, then they all turn over and play begins. Taps are ignored until then.
   `after` waits for the start screen to fade first. */
function peekCards(after = 0) {
  if (!(CFG.peek > 0)) return;
  clearTimeout(peekTimer); peeking = true;
  const show = up => { for (const c of cards) { c.up = up; c.el.classList.toggle("up", up); } };
  peekTimer = setTimeout(() => {
    show(true);
    peekTimer = setTimeout(() => { show(false); peeking = false; }, CFG.peek * 1000);
  }, after);
}

function flipBack() {
  if (!mismatch) return;
  clearTimeout(mismatch.timer);
  for (const x of [mismatch.a, mismatch.b]) { x.up = false; x.el.classList.remove("up"); x.el.setAttribute("aria-label", "card"); }
  mismatch = null; locked = false;
}

/* End of the game: a short fireworks show. */
/* Games finished in this session (kept across reloads of the same tab). Each one makes the next
   fireworks a little longer, so the wait before the next game grows: calmer, less rushing. */
let gamesDone = 0;
try { gamesDone = +sessionStorage.getItem("memoriter-games") || 0; } catch { /* storage blocked */ }
function resetGames() {
  gamesDone = 0;
  try { sessionStorage.setItem("memoriter-games", 0); } catch { /* storage blocked */ }
}
const restDue = () => CFG.rest > 0 && gamesDone >= CFG.rest;

function finale() {
  gamesDone++;
  try { sessionStorage.setItem("memoriter-games", gamesDone); } catch { /* storage blocked */ }
  // One of the cards just matched becomes the shape of the final firework (light colour for the night sky).
  const c = cards.length ? randOf(cards) : null;
  if (c) prepareSymbol(c, c.kind === "swatch" ? lighten(c.show, .15) : c.kind === "emoji" ? "#FFD86B" : lighten(c.color === INK ? "#7FB2F0" : c.color, .3));
  fireworksShow(showAgain, gamesDone);
}

function vanish(c) {
  const r = c.el.getBoundingClientRect();
  sfx.pop();
  sparkle(r.left + r.width / 2, r.top + r.height / 2, r.width, c.color === INK ? null : c.color);
  c.el.classList.add("gone");                       // the grid slot stays, so nothing moves around
  c.el.setAttribute("aria-hidden", "true"); c.el.tabIndex = -1;
}

/* Fit the grid: pick the column count that gives the biggest square cards. */
function layout() {
  const n = cards.length; if (!n) return;
  const cs = getComputedStyle(board);
  const Wd = board.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const Ht = board.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const gap = Math.max(6, Math.min(16, Math.min(Wd, Ht) / 40));
  let best = { size: 0, cols: 1 };
  for (let cols = 1; cols <= n; cols++) {
    const rows = Math.ceil(n / cols);
    const size = Math.min((Wd - gap * (cols - 1)) / cols, (Ht - gap * (rows - 1)) / rows);
    if (size > best.size + .5 || (Math.abs(size - best.size) <= .5 && n % cols === 0)) best = { size, cols };
  }
  const size = Math.floor(Math.min(best.size, 240));
  const root = document.documentElement.style;
  grid.style.gridTemplateColumns = `repeat(${best.cols}, ${size}px)`;
  root.setProperty("--size", size + "px");
  root.setProperty("--gap", gap + "px");
  root.setProperty("--radius", Math.round(size * .14) + "px");
  root.setProperty("--tile", Math.max(12, Math.round(size / 4.5)) + "px");
}

function initBoard() {
  addEventListener("resize", layout);
}

/* ===== src/js/screens.js ===== */
/* screens.js: everything around the board: Start screen, "play again" button,
   ?help=1 (settings list) and ?voices=1 (voice list). */

const HELP = `MEMORITER: a memory pairs game for toddlers. Every setting comes from the URL.

setup    open the parents' setup screen (…/index.html?setup), or hold the faint “…” (bottom-left of the start/end screen) 4 s
theme    numbers | letters | shapes | images (pictures) | colors   (default: the child picks a tile on the Start screen;
         also guessed from letters=, shapes=, items=; then one big tile with a replay badge)
themes   which tiles the Start screen offers, in order, e.g. themes=numbers,colors (default: all five)

phonics  letters say their name (0, default) | their sound, e.g. "buh" (1) | both, "bee … buh" (both)

         pentagon,hexagon,heptagon,octagon,star,heart,semicircle (default: random pick)
emoji    openmoji (default: OpenMoji drawings, same on every device; CC BY-SA 4.0, openmoji.org) | native (the device's own emoji)
set      pictures game: farm | wild | bugs | birds | sea | fruits | nature (things in nature), one or several
         (set=farm,wild,sea: each game picks one of them); random / none = all sets (default: random, a new set each game)
items    your own cards, comma list or repeated; "shown|spoken" to say something else
         e.g. items=A|Apple,B|Ball      with theme=images: emoji or image links, e.g. items=https://…/cat.png|cat

         pair = each pair its own colour
         red|blue|green|orange|purple|pink|brown|yellow or a hex like 2F6FDB = fixed colour
         0 = dark ink
delay    ms before a non-matching pair flips back (default 1200)
vanish   ms a matched pair stays visible before it pops away (default 900)
peek     seconds every card is shown face up when a game starts (default 0 = off)
pace     fast = a tap while two cards are open moves on at once (for quick players).
         Default (calm): those taps are ignored until the wrong pair turns back or the pair pops away.

         random | plain | dots | polka | stripes | diagonal | checks | grid | zigzag | waves | stars | hearts | bubbles

mark     0 = hide the white circle in the middle of the card back

bgcolor  page colour: a colour name (very light tint) or hex like FFF7EA   (default: cream)
(install: open the game on the web, e.g. camayal.info/wa/pairs/, then "Install app" / "Add to Home screen")
fullscreen 0 = don't go full screen when a game tile is tapped (default: full screen where the browser allows it)
seed     number = same shuffle every time
start    0 = skip the Start screen (first card may be silent: browsers need a tap to unlock sound)

rest     games before the sleepy-moon rest screen (default 6; 0 = never). A grown-up holds the small star at the top right ~4 s to unlock.

(grown-ups: hold a game tile ~1 s to lock that game; only it is offered at the end, and the lock survives a reload)
