<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Memoriter</title>
<!-- Development page: loads the source files separately so each one shows up on its own in the
     browser's dev tools. "python build.py" builds dist/ (one self-contained index.html + app files):
     published by GitHub Pages and shown by the iframe at camayal.info/wa/pairs. Add ?help=1 to the URL to see all settings. -->
<link rel="preload" href="assets/fonts/andika-700-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<div id="board"><div id="grid" role="grid" aria-label="Memory cards"></div></div>
<div id="start">
  <div class="themes"></div>
  <p id="langnote"></p>
</div>
<div id="night"></div>
<canvas id="fx"></canvas>
<div id="end"></div>
<div id="rest" aria-label="Time for a break">
  <svg class="sky" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g fill="#fff"><circle class="tw" cx="40" cy="50" r="2.2"/><circle class="tw t2" cx="90" cy="220" r="1.6"/><circle class="tw t3" cx="350" cy="60" r="2"/>
      <circle class="tw t2" cx="310" cy="240" r="1.8"/><circle class="tw" cx="200" cy="30" r="1.4"/><circle class="tw t3" cx="20" cy="160" r="1.5"/>
      <circle class="tw t3" cx="380" cy="170" r="1.6"/><circle class="tw t2" cx="150" cy="275" r="1.3"/></g>
  </svg>
  <div class="unlock-star" aria-hidden="true"><span></span></div>
  <div class="moon-hold">
    <svg viewBox="0 0 300 300" aria-hidden="true">
      <defs><mask id="crescent"><rect width="300" height="300" fill="#fff"/><circle cx="200" cy="105" r="90" fill="#000"/></mask></defs>
      <g class="moon">
        <circle cx="150" cy="150" r="100" fill="#FFE08A" mask="url(#crescent)"/>
        <path d="M82 150 q13 11 26 0" fill="none" stroke="#8A6A1F" stroke-width="5" stroke-linecap="round"/>
        <circle cx="96" cy="178" r="10" fill="#F6A5A5" opacity=".55"/>
        <path d="M112 202 q10 7 20 0" fill="none" stroke="#8A6A1F" stroke-width="4.5" stroke-linecap="round"/>
      </g>
      <g class="zzz" fill="#fff" font-family="Andika,Nunito,system-ui,sans-serif" font-weight="700">
        <text class="z z1" x="205" y="120" font-size="24">z</text>
        <text class="z z2" x="228" y="88" font-size="30">z</text>
        <text class="z z3" x="252" y="52" font-size="38">Z</text>
      </g>
    </svg>
  </div>
</div>

<!-- build:js  (order matters: each file may use names defined by the files above it) -->
<script src="src/js/config.js"></script>
<script src="src/js/i18n.js"></script>
<script src="src/js/colors.js"></script>
<script src="src/js/patterns.js"></script>
<script src="src/js/shapes.js"></script>
<script src="src/js/content.js"></script>
<script src="src/js/audio.js"></script>
<script src="src/js/speech.js"></script>
<script src="src/js/fireworks.js"></script>
<script src="src/js/board.js"></script>
<script src="src/js/screens.js"></script>
<script src="src/js/setup.js"></script>
<script src="src/js/main.js"></script>
<!-- endbuild -->
</body>
</html>
