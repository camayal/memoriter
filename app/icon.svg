<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Memoriter app icon: four cards, two face up with a cat, two face down with the stars card back.
       Everything sits inside the central ~70% so Android can crop it to a circle or squircle. -->
  <defs>
    <pattern id="stars" width="40" height="40" patternUnits="userSpaceOnUse">
      <g fill="#fff" fill-opacity=".42">
        <polygon points="10,4 11.9,8.6 16.7,8.8 12.9,11.8 14.2,16.4 10,13.8 5.8,16.4 7.1,11.8 3.3,8.8 8.1,8.6"/>
        <polygon points="30,24 31.9,28.6 36.7,28.8 32.9,31.8 34.2,36.4 30,33.8 25.8,36.4 27.1,31.8 23.3,28.8 28.1,28.6"/>
      </g>
    </pattern>
    <linearGradient id="back" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#8DB2EE"/><stop offset="1" stop-color="#749FE4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#2F3A4A" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#FFF7EA"/>
  <g filter="url(#shadow)">
    <!-- face up: cat -->
    <rect x="96" y="96" width="150" height="150" rx="26" fill="#fff"/>
    <rect x="266" y="266" width="150" height="150" rx="26" fill="#fff"/>
    <!-- face down: stars card back with the centre circle -->
    <g>
      <rect x="266" y="96" width="150" height="150" rx="26" fill="url(#back)"/>
      <rect x="266" y="96" width="150" height="150" rx="26" fill="url(#stars)"/>
      <circle cx="341" cy="171" r="26" fill="#fff" fill-opacity=".55"/>
    </g>
    <g>
      <rect x="96" y="266" width="150" height="150" rx="26" fill="url(#back)"/>
      <rect x="96" y="266" width="150" height="150" rx="26" fill="url(#stars)"/>
      <circle cx="171" cy="341" r="26" fill="#fff" fill-opacity=".55"/>
    </g>
  </g>
  <text x="171" y="174" font-size="96" text-anchor="middle" dominant-baseline="central">🐱</text>
  <text x="341" y="344" font-size="96" text-anchor="middle" dominant-baseline="central">🐱</text>
</svg>
